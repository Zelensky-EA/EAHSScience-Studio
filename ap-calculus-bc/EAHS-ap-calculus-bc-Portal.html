const integrate=(fn,a,b,n=1000)=>{if(n%2)n++;let h=(b-a)/n,sum=fn(a)+fn(b);for(let i=1;i<n;i++)sum+=(i%2?4:2)*fn(a+i*h);return sum*h/3;};
const bisect=(fn,a,b)=>{let fa=fn(a),fb=fn(b);if(!Number.isFinite(fa)||!Number.isFinite(fb)||fa*fb>0)throw Error('These inputs do not bracket a valid solution.');if(fa===0)return a;if(fb===0)return b;for(let i=0;i<120;i++){let c=(a+b)/2,fc=fn(c);if(fc===0)return c;if(fa*fc>0){a=c;fa=fc;}else b=c;}return(a+b)/2;};
const acidH=(c,ka,sodium=0)=>10**bisect(log=>{let h=10**log;return h+sodium-1e-14/h-c*ka/(ka+h)},-14,1);
const fmt=x=>typeof x==='number'?Number.isFinite(x)?Math.abs(x)>0&&(Math.abs(x)<.001||Math.abs(x)>=1e6)?x.toExponential(4):Number(x.toPrecision(6)).toString():'No finite value':String(x);

// AP CHEMISTRY — nine College Board units.
add('chemistry',1,'moles','Mass, moles & particles','Connect macroscopic mass to mole amount and microscopic particle counts.',[N('mass','Sample mass (g)',18,0,200),N('molar','Molar mass (g/mol)',18.015,1,300)],'n = m/M; N = nNₐ','Pure substance; the particle identity must be specified. Formula units and molecules are not interchangeable.','Explain how equal mole amounts can have different masses.',s=>output([['Amount (mol)',s.mass/s.molar],['Particles',s.mass/s.molar*NA]],[series('Moles',m=>m/s.molar,0,200)],'Mass (g)','Amount (mol)',check('Estimate the sample amount. ',s.mass/s.molar,'mol','Divide mass by molar mass.')));
add('chemistry',1,'isotopes','Isotopes & average atomic mass','Change an isotope abundance and distinguish atomic mass from mass number.',[N('a','Isotope A mass (u)',34.96885,1,250,.001),N('b','Isotope B mass (u)',36.9659,1,250,.001),N('fraction','Isotope A abundance (%)',75.78,0,100,.01)],'Average mass = f mA + (1−f)mB','Two-isotope teaching mixture; isotope masses are entered, not inferred from integer mass numbers.','Explain why the average need not be an integer or the mass of any one atom.',s=>output([['Average atomic mass (u)',s.fraction/100*s.a+(1-s.fraction/100)*s.b]],[series('Weighted average',f=>f/100*s.a+(1-f/100)*s.b,0,100)],'Isotope A abundance (%)','Average mass (u)',check('Estimate the average atomic mass.',s.fraction/100*s.a+(1-s.fraction/100)*s.b,'u','Weight each isotope mass by its fractional abundance.')));
add('chemistry',1,'electrons','Electron configuration & ions','Fill occupied subshells through calcium and compare neutral atoms with ions.',[N('z','Atomic number Z',17,1,20,1),N('charge','Ion charge',0,-3,3,1)],'Electron count = Z − ionic charge','Ground-state Aufbau filling through 20 electrons. No transition-metal exceptions; subshell boxes are symbolic, not electron trajectories.','Distinguish changes in electron number from changes in nuclear identity.',s=>{let e=s.z-s.charge;if(e<0||e>20)throw Error('Keep electron count between 0 and 20.');let left=e,boxes=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2]].map(([n,c])=>{let k=Math.min(left,c);left-=k;return n+' : '+k+' electrons'});return output([['Electrons',e]],[],'','',check('Estimate the electron count.',e,'electrons','Subtract the signed ionic charge from the atomic number.'),boxes);});
add('chemistry',1,'photoelectrons','Photoelectron spectroscopy','Compare symbolic shell peaks and occupied-electron intensities.',[S('atom','Atom','Ne',['C','O','Ne','Na']),N('scale','Relative intensity scale',1,.1,3)],'Photon energy = binding energy + electron kinetic energy','Illustrative shell binding positions, not measured spectra. Peak area represents electron count within this simplified display.','Use peak position and area for different kinds of evidence.',s=>{let entries={C:[[280,2],[20,2],[11,2]],O:[[540,2],[30,2],[14,4]],Ne:[[870,2],[48,2],[22,6]],Na:[[1070,2],[65,2],[31,6],[5,1]]}[s.atom];return output([['Represented electrons',entries.reduce((a,x)=>a+x[1],0)]],[{name:'Illustrative peaks',points:entries.flatMap(([x,n])=>[[x-1,0],[x,n*s.scale],[x+1,0]])}],'Illustrative binding energy (eV)','Relative electron intensity',conceptual('A larger peak area primarily indicates what?',['More electrons represented','A larger atomic mass alone','A lower photon frequency alone'],0,'Area reports relative electron count; binding-energy position reports how tightly electrons are held.'));});
add('chemistry',1,'photon','Photon energy & wavelength','Connect electromagnetic wavelength, frequency and photon energy.',[N('lambda','Wavelength (nm)',500,50,1500,1)],'E = hc/λ; ν = c/λ','Monochromatic light; photons have energy but this model does not calculate absorption probabilities.','Explain the inverse wavelength–energy relationship.',s=>{let E=6.62607015e-34*299792458/(s.lambda*1e-9);return output([['Photon energy (J)',E],['Energy (kJ/mol photons)',E*NA/1000]],[series('Photon energy',l=>6.62607015e-34*299792458/(l*1e-9),50,1500)],'Wavelength (nm)','Energy (J/photon)',check('Estimate photon energy.',E,'J','Convert nm to m before applying E = hc/λ.'));});
add('chemistry',2,'coulomb','Ionic attraction & distance','Explore the inverse-distance energy of two point charges.',[N('q1','Charge 1 (elementary charges)',1,-3,3,1),N('q2','Charge 2 (elementary charges)',-1,-3,3,1),N('r','Separation (nm)',.3,.1,2,.01)],'U ∝ q₁q₂/r','Point-charge energy in vacuum; actual lattice enthalpy sums many interactions and includes repulsion.','Compare charge magnitude and separation without equating pair energy to lattice enthalpy.',s=>{let U=138.935456*s.q1*s.q2/s.r;return output([['Pair energy (kJ/mol pairs)',U]],[series('Pair electrostatic energy',r=>138.935456*s.q1*s.q2/r,.1,2)],'Separation (nm)','Pair energy (kJ/mol)',check('Estimate pair energy.',U,'kJ/mol','The signed charge product determines attraction or repulsion.'));});
add('chemistry',2,'vsepr','VSEPR geometry & lone pairs','Change electron domains and distinguish electron geometry from molecular geometry.',[N('domains','Total electron domains',4,2,6,1),N('lone','Central-atom lone pairs',1,0,3,1)],'Electron-domain geometry depends on domain count; molecular geometry depends on atom positions.','Ideal domain model. A multiple bond counts as one domain; real bond angles depend on the molecule.','Explain why tetrahedral electron geometry does not always mean tetrahedral molecular geometry.',s=>{if(s.domains-s.lone<2)throw Error('Choose at least two bonded atoms.');let names={2:['Linear'],3:['Trigonal planar','Bent'],4:['Tetrahedral','Trigonal pyramidal','Bent'],5:['Trigonal bipyramidal','Seesaw','T-shaped','Linear'],6:['Octahedral','Square pyramidal','Square planar']};if(!names[s.domains][s.lone])throw Error('This domain/lone-pair combination is outside this geometry explorer.');let shape=names[s.domains][s.lone];return output([['Bonded atoms',s.domains-s.lone],['Molecular geometry',shape]],[],'','',check('Estimate the number of bonded atoms.',s.domains-s.lone,'atoms','Subtract central lone-pair domains from total domains.'),Array.from({length:s.domains},(_,i)=>i<s.lone?'Lone-pair domain':'Bonding domain'));});
add('chemistry',2,'formal-charge','Lewis structures & formal charge','Account for assigned electrons without treating formal charge as measured partial charge.',[N('valence','Valence electrons on isolated atom',5,1,8,1),N('nonbond','Nonbonding electrons on atom',2,0,8,1),N('bonding','Bonding electrons around atom',6,0,12,1)],'FC = valence − nonbonding − bonding/2','One atom in a proposed Lewis structure. This does not validate the total molecular electron count or octet.','Use charge bookkeeping alongside total electrons, resonance and bonding.',s=>output([['Formal charge',s.valence-s.nonbond-s.bonding/2]],[],'','',check('Estimate formal charge on this atom.',s.valence-s.nonbond-s.bonding/2,'elementary charges','Assign all lone-pair electrons and half of each bond to the atom.'),['Valence electron allocation','Nonbonding electron allocation','Half of bonding electrons','Formal charge bookkeeping']));

const family=S('family','Function family','square',['square','cube','sin','exp']);
function calc(unit,id,title,desc,fields,eq,limits,goal,compute,bc=false){add(bc?'bc':'calculus',unit,id,title,desc,fields,eq,limits,goal,compute);}
calc(1,'removable','Removable discontinuities','Approach a missing point while separating f(a) from the limit.',[N('a','Missing-point x-coordinate a',2,-3,3),N('h','Distance h from a',.1,.0001,1,.0001)],'(x²−a²)/(x−a) = x+a, only for x≠a','A factored rational family; the original expression is undefined at a. The graph explicitly marks the hole.','Explain why a limit can exist even when the function value is missing.',s=>{let v=2*s.a;let out=output([['Left sample',2*s.a-s.h],['Right sample',2*s.a+s.h],['f(a)','Undefined']],[series('x+a away from the hole',x=>x+s.a,s.a-2,s.a+2)],'x','f(x)',check('Estimate the two-sided limit at x=a.',v,'function units','Cancel a common factor only away from the missing point; then take the limit.'));out.holes=[[s.a,v]];return out;});
calc(1,'one-sided','One-sided limits & jumps','Change left and right limits independently.',[N('left','Left-limit value',1,-5,5),N('right','Right-limit value',3,-5,5),N('value','Defined f(0)',2,-5,5)],'A two-sided limit exists only if both one-sided limits agree.','Piecewise constant example, with separately defined f(0).','Distinguish function value, one-sided limits and the two-sided limit.',s=>{let o=output([['Limit at 0',s.left===s.right?s.left:'Does not exist'],['f(0)',s.value]],[series('Left branch',()=>s.left,-2,-.001),series('Right branch',()=>s.right,.001,2)],'x','f(x)',conceptual('What is required for a two-sided limit?',['Equal one-sided limits','A defined f(0) alone','Equal slopes far from 0'],0,'Left and right approaches must agree, regardless of f(0).'));o.holes=[[0,s.left],[0,s.right]];o.dots=[[0,s.value]];return o;});
calc(1,'squeeze','Squeeze theorem & oscillation','Bound an oscillating function near zero.',[N('amplitude','Envelope multiplier a',1,.1,3),N('window','Half-width of viewed interval',1,.05,2,.01)],'−ax² ≤ ax²sin(1/x) ≤ ax²','Set the value at 0 to 0 for plotting; rapid oscillations below sample resolution are not resolved.','Justify a limit using bounds rather than visual smoothness.',s=>output([['Limit at zero',0]],[series('Oscillating function',x=>x===0?0:s.amplitude*x*x*Math.sin(1/x),-s.window,s.window,1000),series('Upper envelope',x=>s.amplitude*x*x,-s.window,s.window),series('Lower envelope',x=>-s.amplitude*x*x,-s.window,s.window)],'x','f(x)',conceptual('Why is the limit zero despite oscillation?',['Both bounding envelopes tend to zero','The sine function stops oscillating','Every nearby function value is zero'],0,'The squeeze theorem applies because the upper and lower bounds have the same limit.')));
calc(1,'ivt','Intermediate value theorem','Test a target against endpoint values of a continuous cubic.',[N('a','Left endpoint a',-2,-3,2),N('b','Right endpoint b',2,-2,3),N('target','Target y-value',1,-10,10)],'Continuous f on [a,b] takes every value between f(a) and f(b).','f(x)=x³−3x. Endpoint bracketing guarantees existence, not uniqueness. Lack of bracketing does not establish nonexistence.','State hypotheses and distinguish a guarantee from a guess.',s=>{if(s.a>=s.b)throw Error('Choose a<b.');let yes=s.target>=Math.min(poly(s.a),poly(s.b))&&s.target<=Math.max(poly(s.a),poly(s.b));return output([['f(a)',poly(s.a)],['f(b)',poly(s.b)],['Endpoint IVT guarantee',yes?'Yes':'Not supplied by these endpoints']],[series('f(x)=x³−3x',poly,s.a,s.b),series('Target',()=>s.target,s.a,s.b)],'x','y',conceptual('What additional hypothesis is required beyond endpoint bracketing?',['Continuity on the whole interval','Only differentiability at the endpoints','A positive derivative everywhere'],0,'Continuity on [a,b] is the required hypothesis.'));});
calc(2,'secant','Secants & the derivative limit','Shrink a secant interval and compare its slope with an analytic derivative.',[family,N('x','Base x-coordinate',1,-2,2),N('h','Signed step h',.5,-1,1,.001)],'Secant slope = [f(x+h)−f(x)]/h','Preset functions only. h cannot be zero; derivatives are analytic rather than inferred from tiny floating-point differences.','Explain what changes and what remains fixed as h approaches zero.',s=>{if(s.h===0)throw Error('Use a nonzero h.');let f=fn[s.family],m=(f.f(s.x+s.h)-f.f(s.x))/s.h;return output([['Secant slope',m],['Derivative at x',f.d(s.x)]],[series('Function',f.f,-3,3),series('Secant line',x=>f.f(s.x)+m*(x-s.x),-3,3)],'x','y',check('Estimate the tangent slope at the base point.',f.d(s.x),'y units/x unit','Use the limit of the difference quotient or the analytic derivative.'));});
calc(2,'tangent','Tangent lines & local behavior','Move along a cubic and compare the tangent with the curve.',[N('x','Tangency x-coordinate',1.5,-2,2)],'Tangent: y=f(a)+f′(a)(x−a)','f(x)=x³−3x; the tangent is local, not a global replacement for the curve.','Explain why equal values at the tangency point do not imply equal values elsewhere.',s=>output([['Tangent slope',dp(s.x)]],[series('Cubic',poly,-3,3),series('Tangent',x=>poly(s.x)+dp(s.x)*(x-s.x),-3,3)],'x','y',check('Estimate tangent slope.',dp(s.x),'slope units','Differentiate the cubic: f′(x)=3x²−3.')));
calc(2,'product','Product rule','Compare the derivative of x²sin(bx) to both contributing terms.',[N('b','Frequency multiplier b',1,.2,3),N('x','Evaluation x',1,-2,2)],'(uv)′=u′v+uv′','All trigonometric inputs are in radians. Neither factor is treated as constant.','Explain why multiplying two derivatives is not the product rule.',s=>{let d=x=>2*x*Math.sin(s.b*x)+x*x*s.b*Math.cos(s.b*x);return output([['Derivative at x',d(s.x)]],[series('Derivative',d,-3,3),series('u′v',x=>2*x*Math.sin(s.b*x),-3,3),series('uv′',x=>x*x*s.b*Math.cos(s.b*x),-3,3)],'x','Derivative',check('Estimate the derivative at the entered x.',d(s.x),'slope units','Add u′v and uv′, including the inner frequency multiplier.'));});
calc(2,'quotient','Quotient rule','Investigate the derivative of x/(x²+c) with a positive denominator parameter.',[N('c','Positive denominator constant c',1,.1,5),N('x','Evaluation x',1,-3,3)],'(u/v)′=(u′v−uv′)/v²','c>0, so the chosen denominator never vanishes for real x.','Explain why the sign of the derivative can change even when the denominator is positive.',s=>{let d=x=>(s.c-x*x)/(x*x+s.c)**2;return output([['Derivative',d(s.x)]],[series('Function',x=>x/(x*x+s.c),-4,4),series('Derivative',d,-4,4)],'x','Value',check('Estimate the derivative.',d(s.x),'slope units','Simplify the quotient-rule numerator to c−x².'));});
calc(3,'chain','Chain rule & composition','Differentiate sin(bx²) and track the inner derivative.',[N('b','Inner coefficient b',1,.1,3),N('x','Evaluation x',.5,-2,2)],'d/dx sin(bx²) = cos(bx²)·2bx','Angles in radians; x range is bounded to display multiple oscillations.','Explain why the outer derivative must be multiplied by the inner derivative.',s=>{let d=x=>2*s.b*x*Math.cos(s.b*x*x);return output([['Derivative',d(s.x)]],[series('Composite function',x=>Math.sin(s.b*x*x),-2,2),series('Derivative',d,-2,2)],'x','Value',check('Estimate the composite derivative.',d(s.x),'slope units','Differentiate the outer sine and multiply by 2bx.'));});
calc(3,'implicit','Implicit differentiation','Locate a circle point and calculate its tangent slope on a selected branch.',[N('r','Circle radius',2,.5,4),N('x','Point x-coordinate',1,-3,3),S('branch','Circle branch','upper',['upper','lower'])],'x²+y²=r² ⇒ dy/dx=−x/y','At x=±r the tangent is vertical and a finite dy/dx does not exist. This explorer requires |x|<r.','Explain why solving for y is not required to differentiate implicitly.',s=>{if(Math.abs(s.x)>=s.r)throw Error('Choose |x|<r to obtain a finite tangent slope.');let sign=s.branch==='upper'?1:-1,y=sign*Math.sqrt(s.r*s.r-s.x*s.x),m=-s.x/y;return output([['Point y',y],['Tangent slope',m]],[series('Upper circle',x=>Math.sqrt(Math.max(0,s.r*s.r-x*x)),-s.r,s.r),series('Lower circle',x=>-Math.sqrt(Math.max(0,s.r*s.r-x*x)),-s.r,s.r),series('Tangent',x=>y+m*(x-s.x),-s.r,s.r)],'x','y',check('Estimate dy/dx at the selected point.',m,'slope units','Differentiate both x and y terms with respect to x, then use the actual y-coordinate.'));});
calc(3,'inverse','Inverse functions & derivative','Compare a monotone exponential with its logarithmic inverse.',[N('b','Exponent multiplier b',1,.2,3),N('x','Inverse-function input x',2,.1,5)],'(f⁻¹)′(x)=1/f′(f⁻¹(x)); for f=e^(bx), (f⁻¹)′=1/(bx)','f is one-to-one for b>0; logarithm input must be positive.','Explain why derivatives of inverse functions are evaluated at related points.',s=>output([['Inverse value ln(x)/b',Math.log(s.x)/s.b],['Inverse derivative',1/(s.b*s.x)]],[series('Inverse ln(x)/b',x=>Math.log(x)/s.b,.1,5)],'x','Inverse value',check('Estimate the derivative of the inverse.',1/(s.b*s.x),'slope units','Apply the inverse derivative rule or differentiate ln(x)/b.')));
calc(3,'second','Higher derivatives & concavity','Connect cubic function, first derivative and second derivative.',[N('a','Cubic coefficient a',1,.2,3),N('b','Linear coefficient b',-3,-5,5),N('x','Evaluation x',1,-2,2)],'f=ax³+bx; f′=3ax²+b; f″=6ax','Continuous polynomial family. Concavity concerns how f′ changes, not whether f is positive.','Distinguish decreasing from concave down using both derivatives.',s=>output([['First derivative',3*s.a*s.x*s.x+s.b],['Second derivative',6*s.a*s.x]],[series('f′',x=>3*s.a*x*x+s.b,-2,2),series('f″',x=>6*s.a*x,-2,2)],'x','Derivative',check('Estimate the second derivative.',6*s.a*s.x,'second-derivative units','Differentiate the cubic twice.')));
calc(4,'motion','Position, velocity & acceleration','Interpret a polynomial position model and locate instantaneous rates.',[N('a','Cubic coefficient (m/s³)',1,.1,3),N('b','Linear coefficient (m/s)',-3,-8,8),N('time','Time (s)',1,0,3)],'s=at³+bt; v=3at²+b; acceleration=6at','One-dimensional ideal motion; signs describe direction, not speed magnitude.','Explain when an object speeds up using velocity and acceleration signs.',s=>output([['Position (m)',s.a*s.time**3+s.b*s.time],['Velocity (m/s)',3*s.a*s.time*s.time+s.b],['Acceleration (m/s²)',6*s.a*s.time]],[series('Velocity',t=>3*s.a*t*t+s.b,0,3),series('Acceleration',t=>6*s.a*t,0,3)],'Time (s)','Rate (see legend units)',check('Estimate instantaneous velocity.',3*s.a*s.time*s.time+s.b,'m/s','Differentiate position; do not divide position by time.')));
calc(4,'related-sphere','Related rates: expanding sphere','Relate a radius rate to volume rate at one instant.',[N('r','Radius (cm)',2,.1,5),N('dr','Radius rate (cm/s)',.1,-1,1,.01)],'dV/dt = 4πr² dr/dt','Sphere geometry with instantaneous supplied radius rate. A constant radius rate does not give a constant volume rate.','Explain why the current radius is needed as well as its rate.',s=>output([['Volume rate (cm³/s)',4*Math.PI*s.r*s.r*s.dr]],[series('Volume rate',r=>4*Math.PI*r*r*s.dr,.1,5)],'Radius (cm)','dV/dt (cm³/s)',check('Estimate dV/dt.',4*Math.PI*s.r*s.r*s.dr,'cm³/s','Differentiate the volume equation with respect to time.')));
calc(4,'linearization','Linear approximation','Approximate a square root near a positive base point and compare the exact value.',[N('a','Positive base a',4,.5,9),N('dx','Change in x',.2,-.4,.4,.01)],'L(a+h)=√a + h/(2√a)','Uses a local tangent approximation; the exact square root remains defined for these bounds.','Explain how error changes as the target moves away from the base point.',s=>{let L=Math.sqrt(s.a)+s.dx/(2*Math.sqrt(s.a)),exact=Math.sqrt(s.a+s.dx);return output([['Approximation',L],['Exact value',exact],['Approximation minus exact',L-exact]],[series('√x',Math.sqrt,s.a-.45,s.a+.45),series('Linearization',x=>Math.sqrt(s.a)+(x-s.a)/(2*Math.sqrt(s.a)),s.a-.45,s.a+.45)],'x','Value',check('Estimate the linear approximation.',L,'function units','Evaluate the tangent approximation rather than the exact square root.'));});
calc(4,'lhopital','L’Hôpital’s rule & indeterminate limits','Compare a 0/0 family with its derivative ratio near zero.',[N('b','Frequency multiplier b',2,.1,4),N('h','Approach distance h',.1,.0001,.5,.0001)],'lim x→0 sin(bx)/x = b','Requires the 0/0 form and valid derivative-ratio limit; direct substitution alone does not give the limit. Radians are required.','State the indeterminate form before applying a rule.',s=>output([['At h',Math.sin(s.b*s.h)/s.h],['Limit',s.b]],[series('sin(bx)/x',x=>x===0?s.b:Math.sin(s.b*x)/x,-1,1)],'x','Value',check('Estimate the limit as x approaches zero.',s.b,'function units','Differentiate numerator and denominator or use the standard sine limit.')));
calc(5,'mvt','Mean value theorem','Locate the point whose tangent slope equals an interval’s secant slope.',[N('a','Left endpoint',0,-3,2),N('b','Right endpoint',2,-2,3)],'For f=x², f′(c)=[f(b)−f(a)]/(b−a), so c=(a+b)/2','Continuous on [a,b], differentiable on (a,b). Only the quadratic family is solved here.','Explain why both MVT hypotheses are needed.',s=>{if(s.a>=s.b)throw Error('Choose a<b.');let c=(s.a+s.b)/2;return output([['MVT point c',c],['Secant slope',s.a+s.b]],[series('x²',x=>x*x,s.a,s.b),series('Secant',x=>s.a*s.a+(s.a+s.b)*(x-s.a),s.a,s.b)],'x','y',check('Estimate the MVT point c.',c,'x units','Solve 2c=a+b.'));});
calc(5,'critical','Critical points & sign analysis','Use the derivative’s sign to classify a cubic’s stationary points.',[N('a','Positive cubic coefficient a',1,.2,3),N('b','Linear coefficient b',-3,-6,3)],'f′=3ax²+b; sign changes classify extrema','For b<0 there are two stationary points; b=0 is a stationary inflection; b>0 has none.','Explain why f′=0 alone does not establish a local extremum.',s=>{let c=s.b<0?Math.sqrt(-s.b/(3*s.a)):0;return output([['Stationary points',s.b<0?fmt(-c)+' and '+fmt(c):s.b===0?'0':'None'],['Classification',s.b<0?'Left maximum; right minimum':s.b===0?'Stationary inflection':'Increasing everywhere']],[series('f',x=>s.a*x**3+s.b*x,-3,3),series('f′',x=>3*s.a*x*x+s.b,-3,3)],'x','Value',conceptual('What confirms a local maximum by the first derivative test?',['f′ changes from positive to negative','f′ is zero at one point alone','f″ must be positive'],0,'A positive-to-negative derivative sign change means increasing followed by decreasing.'));});
calc(5,'absolute-extrema','Absolute extrema on an interval','Compare endpoints and interior critical points rather than checking only stationary points.',[N('a','Left endpoint',-2,-3,2),N('b','Right endpoint',2,-2,3)],'Candidates are endpoints and interior critical points.','f=x³−3x is continuous; the closed interval guarantees attained extrema.','Explain why endpoints must be checked even when their derivatives are not zero.',s=>{if(s.a>=s.b)throw Error('Choose a<b.');let xs=[s.a,s.b,...[-1,1].filter(x=>x>s.a&&x<s.b)],rows=xs.map(x=>[x,poly(x)]),min=Math.min(...rows.map(x=>x[1])),max=Math.max(...rows.map(x=>x[1]));return output([['Absolute minimum value',min],['Absolute maximum value',max]],[series('Cubic',poly,s.a,s.b)],'x','f(x)',check('Estimate the absolute maximum function value.',max,'function units','Evaluate both endpoints and all interior critical points.'),[],{headers:['Candidate x','f(x)'],rows});});
calc(5,'optimization','Optimization: open-top box','Change a corner cut and locate maximum volume for a rectangular sheet.',[N('length','Sheet length',10,4,20),N('width','Sheet width',8,4,20),N('cut','Corner cut x',1,.01,3,.01)],'V=x(L−2x)(W−2x)','Cuts require 0<x<min(L,W)/2. Thin sheet, no material thickness or construction constraints.','Derive a function, state its domain and justify the maximum.',s=>{let end=Math.min(s.length,s.width)/2;if(s.cut>=end)throw Error('Keep the cut below half the smaller sheet dimension.');let opt=((s.length+s.width)-Math.sqrt((s.length+s.width)**2-3*s.length*s.width))/6,f=x=>x*(s.length-2*x)*(s.width-2*x);return output([['Current volume',f(s.cut)],['Optimal cut',opt],['Maximum volume',f(opt)]],[series('Box volume',f,0,end)],'Cut size','Volume',check('Estimate the optimal cut size.',opt,'length units','Differentiate volume and choose the critical point in the feasible interval.'));});
calc(6,'riemann','Riemann sums','Compare left, right and midpoint rectangle approximations with an exact definite integral.',[family,N('a','Lower bound',0,-2,2),N('b','Upper bound',2,-1,3),N('n','Number of subintervals',8,1,100,1),S('method','Sample point','midpoint',['left','right','midpoint'])],'Sum f(xᵢ*)Δx approaches ∫f(x)dx','Equal-width rectangles; preset analytic functions. Signed contributions are retained.','Explain over- and under-estimation using monotonicity, not a memorized universal rule.',s=>{if(s.a>=s.b)throw Error('Choose a<b.');let f=fn[s.family],h=(s.b-s.a)/s.n,offset={left:0,right:1,midpoint:.5}[s.method],rect=Array.from({length:s.n},(_,i)=>({a:s.a+i*h,b:s.a+(i+1)*h,y:f.f(s.a+(i+offset)*h)})),sum=rect.reduce((t,r)=>t+r.y*h,0),out=output([['Riemann sum',sum],['Exact integral',f.F(s.b)-f.F(s.a)]],[series('Function',f.f,s.a,s.b)],'x','f(x)',check('Estimate the exact definite integral.',f.F(s.b)-f.F(s.a),'area units','Use an antiderivative and evaluate upper minus lower.',.1));out.rectangles=rect;return out;});
calc(6,'accumulation','Accumulation & the FTC','Explore A(x)=∫₀ˣ(t²−c)dt and connect its slope to the integrand.',[N('c','Integrand constant c',1,0,4),N('x','Upper limit x',2,-2,3)],'A(x)=x³/3−cx; A′(x)=x²−c','Variable upper limit may be negative; orientation determines the sign of accumulation.','Explain why an accumulation function can decrease even when its value is positive.',s=>output([['Accumulation A(x)',s.x**3/3-s.c*s.x],['A′(x)',s.x*s.x-s.c]],[series('A(x)',x=>x**3/3-s.c*x,-2,3),series('A′(x)',x=>x*x-s.c,-2,3)],'x','Value',check('Estimate A′ at the current upper limit.',s.x*s.x-s.c,'accumulation units/x unit','The FTC gives the integrand evaluated at x.')));
calc(6,'ftc-chain','FTC with a composite upper bound','Differentiate an integral whose upper endpoint is x².',[N('x','Input x',1,-2,2)],'d/dx ∫₀^(x²)sin(t)dt = 2x sin(x²)','Angles in radians; the accumulation function is 1−cos(x²).','Explain why simply substituting x² into the integrand is incomplete.',s=>output([['Accumulation',1-Math.cos(s.x*s.x)],['Derivative',2*s.x*Math.sin(s.x*s.x)]],[series('Accumulation',x=>1-Math.cos(x*x),-2,2),series('Derivative',x=>2*x*Math.sin(x*x),-2,2)],'x','Value',check('Estimate the derivative.',2*s.x*Math.sin(s.x*s.x),'slope units','Evaluate the integrand at the upper bound and multiply by that bound’s derivative.')));
calc(6,'substitution','Definite integration & substitution','Transform ∫2x cos(x²)dx and preserve the definite bounds.',[N('a','Lower bound',0,-2,2),N('b','Upper bound',1,-2,2)],'∫ₐᵇ2x cos(x²)dx = sin(b²)−sin(a²)','Signed definite integral; reversed bounds are allowed and negate the result.','Explain why bounds must change when the integration variable changes.',s=>output([['Definite integral',Math.sin(s.b*s.b)-Math.sin(s.a*s.a)]],[series('Integrand',x=>2*x*Math.cos(x*x),-2,2)],'x','Integrand',check('Estimate the definite integral.',Math.sin(s.b*s.b)-Math.sin(s.a*s.a),'area units','Use u=x² or the antiderivative sin(x²).')));
calc(7,'slope-field','Slope fields & solution curves','Compare local slopes y′=x−y with a solution through an initial point.',[N('x0','Initial x',0,-1,1),N('y0','Initial y',1,-2,3)],'y=x−1+(y₀−x₀+1)e^(−(x−x₀))','Analytic solution of y′=x−y; the slope-field marks are local directions, not finite changes.','Explain how the same differential equation has many solution curves.',s=>{let out=output([['Initial slope',s.x0-s.y0]],[series('Solution',x=>x-1+(s.y0-s.x0+1)*Math.exp(-(x-s.x0)),-1,3)],'x','y',check('Estimate the slope at the initial point.',s.x0-s.y0,'y units/x unit','Substitute the initial x and y into the differential equation.'));out.slopeField={fn:(x,y)=>x-y,xmin:-1,xmax:3,ymin:-3,ymax:5};return out;});
calc(7,'separation','Separable differential equations','Compare solution values for y′=xy after an initial condition selects a constant.',[N('y0','Initial y(0)',1,.1,3),N('x','Evaluation x',1,-2,2)],'dy/y=x dx ⇒ y=y₀e^(x²/2)','Positive initial value; the identically zero solution also exists but is not included in these controls.','Explain why division by y requires attention to a possible zero solution.',s=>output([['Solution y(x)',s.y0*Math.exp(s.x*s.x/2)]],[series('Particular solution',x=>s.y0*Math.exp(x*x/2),-2,2)],'x','y',check('Estimate the solution at the entered x.',s.y0*Math.exp(s.x*s.x/2),'y units','Integrate, exponentiate and apply the initial condition.')));
calc(7,'exponential-de','Exponential differential equations','Model growth or decay from a constant relative rate.',[N('y0','Initial amount',100,1,500,1),N('k','Relative rate (1/time)',.2,-1,1,.01),N('time','Elapsed time',3,0,10)],'y′=ky ⇒ y=y₀e^(kt)','Constant rate and no resource limit or source term; time units must match k.','Explain the distinction between constant relative rate and constant absolute rate.',s=>output([['Amount at time',s.y0*Math.exp(s.k*s.time)]],[series('Amount',t=>s.y0*Math.exp(s.k*t),0,10)],'Time','Amount',check('Estimate the amount at the entered time.',s.y0*Math.exp(s.k*s.time),'amount units','Use e^(kt), including a negative k for decay.')));
calc(7,'verify-solution','Verifying a differential-equation solution','Substitute a candidate y=Ce^(ax) into y′=ky.',[N('c','Candidate multiplier C',1,.1,3),N('a','Candidate exponent a',.5,-1,1,.01),N('k','Equation coefficient k',.5,-1,1,.01),N('x','Evaluation x',1,-2,2)],'Residual y′−ky = (a−k)Ce^(ax)','For nonzero C, the candidate solves the equation for all x only if a=k. One numerical point alone is not a proof.','Explain why checking a derivative is stronger than checking only an initial value.',s=>output([['Residual at x',(s.a-s.k)*s.c*Math.exp(s.a*s.x)],['Solves for all x',s.a===s.k?'Yes':'No']],[series('Residual',x=>(s.a-s.k)*s.c*Math.exp(s.a*x),-2,2)],'x','Residual',check('Estimate the residual y′−ky.',(s.a-s.k)*s.c*Math.exp(s.a*s.x),'rate units','Differentiate the candidate and subtract the equation’s right side.')));
calc(8,'distance','Displacement & total distance','Split a linear velocity integral at a direction change.',[N('c','Zero-velocity time c (s)',1,0,4),N('a','Starting time (s)',0,0,3),N('b','Ending time (s)',3,.1,5)],'Displacement=∫v dt; distance=∫|v|dt, v=t−c','One-dimensional motion. Integrals are evaluated analytically using the antiderivative of |t−c|.','Explain why total distance can exceed displacement magnitude.',s=>{if(s.a>=s.b)throw Error('Choose a<b.');let D=.5*(s.b*s.b-s.a*s.a)-s.c*(s.b-s.a),Fv=t=>.5*(t-s.c)*Math.abs(t-s.c),dist=Fv(s.b)-Fv(s.a);return output([['Displacement (m)',D],['Total distance (m)',dist]],[series('Velocity (m/s)',t=>t-s.c,s.a,s.b)],'Time (s)','Velocity (m/s)',check('Estimate total distance.',dist,'m','Integrate speed, splitting at t=c if it lies in the interval.'));});
calc(8,'area-between','Area between curves','Use the correct upper-minus-lower integrand between two intersections.',[N('h','Parabola height H',4,.1,9)],'Area between y=H−x² and y=0 is 4H^(3/2)/3','The full bounded region is between x=−√H and x=√H. Area is nonnegative.','Explain how intersections determine bounds.',s=>output([['Bounded area',4*s.h**1.5/3]],[series('Parabola',x=>s.h-x*x,-Math.sqrt(s.h),Math.sqrt(s.h)),series('Lower curve',()=>0,-Math.sqrt(s.h),Math.sqrt(s.h))],'x','y',check('Estimate bounded area.',4*s.h**1.5/3,'area units','Integrate H−x² between the two intersections.')));
calc(8,'volumes','Disks & washers','Compare rotational cross-section area with region height.',[N('outer','Outer radius R',3,.1,6),N('inner','Inner radius r',1,0,5),N('length','Interval length',2,.1,5)],'V = ∫π(R²−r²)dx','Constant-radius annular solid over the interval. Real variable-radius problems require functions inside the integral.','Explain why squaring a difference of radii is not the washer area.',s=>{if(s.inner>=s.outer)throw Error('Keep inner radius smaller than outer radius.');let v=Math.PI*(s.outer*s.outer-s.inner*s.inner)*s.length;return output([['Cross-section area',Math.PI*(s.outer*s.outer-s.inner*s.inner)],['Volume',v]],[],'','',check('Estimate solid volume.',v,'volume units','Subtract disk areas, then multiply by interval length.'),['Outer disk radius: '+s.outer,'Inner disk radius: '+s.inner,'Length: '+s.length]);});
calc(8,'average-value','Average value of a function','Compare an integral’s total with its interval-normalized average.',[family,N('a','Left endpoint',0,-2,2),N('b','Right endpoint',2,-1,3)],'favg = (1/(b−a))∫ₐᵇf(x)dx','Continuous preset families; an average value is not necessarily the midpoint function value.','Explain why dividing by interval length is required.',s=>{if(s.a>=s.b)throw Error('Choose a<b.');let f=fn[s.family],avg=(f.F(s.b)-f.F(s.a))/(s.b-s.a);return output([['Average value',avg]],[series('Function',f.f,s.a,s.b),series('Average-value line',()=>avg,s.a,s.b)],'x','f(x)',check('Estimate average value.',avg,'function units','Find the signed integral and divide by interval length.'));});

calc(6,'parts','Integration by parts','Evaluate ∫xeˣdx and compare the boundary term with the remaining integral.',[N('a','Lower bound',0,-2,2),N('b','Upper bound',1,-2,3)],'∫u dv = uv−∫v du; ∫xeˣdx=(x−1)eˣ+C','BC topic; definite integral preserves bound orientation.','Justify a choice of u and dv that simplifies the remaining integral.',s=>{let I=(s.b-1)*Math.exp(s.b)-(s.a-1)*Math.exp(s.a);return output([['Definite integral',I]],[series('xeˣ',x=>x*Math.exp(x),-2,3)],'x','Integrand',check('Estimate the definite integral.',I,'area units','Use u=x and dv=eˣdx.'));},true);
calc(6,'partial-fractions','Partial fractions','Decompose a rational integrand with distinct linear factors.',[N('a','Positive factor a',1,.1,4),N('b','Positive factor b',2,.1,4),N('end','Upper integration bound',2,.1,5)],'1/((x+a)(x+b))=[1/(x+a)−1/(x+b)]/(b−a)','BC topic; distinct positive a and b keep poles outside [0,end].','Explain why a rational decomposition can make integration simpler.',s=>{if(Math.abs(s.a-s.b)<1e-8)throw Error('Choose distinct factors a and b.');let I=(Math.log((s.end+s.a)/(s.end+s.b))-Math.log(s.a/s.b))/(s.b-s.a);return output([['Integral from 0 to upper bound',I]],[series('Rational integrand',x=>1/((x+s.a)*(x+s.b)),0,s.end)],'x','Integrand',check('Estimate the definite integral.',I,'area units','Integrate the two logarithmic terms with the factor 1/(b−a).'));},true);
calc(6,'improper','Improper integrals & convergence','Compare finite cutoffs with the infinite integral of x^(−p).',[N('p','Exponent p',2,.2,4),N('cutoff','Finite upper cutoff B',10,2,100,1)],'∫₁∞ x^(−p)dx converges only for p>1','BC topic. A finite positive cutoff always gives finite area, which alone does not establish convergence.','Distinguish a large finite approximation from a convergent improper integral.',s=>{let I=s.p===1?Math.log(s.cutoff):(s.cutoff**(1-s.p)-1)/(1-s.p);return output([['Finite-cutoff integral',I],['Infinite integral',s.p>1?1/(s.p-1):'Diverges']],[series('Finite accumulated area',b=>s.p===1?Math.log(b):(b**(1-s.p)-1)/(1-s.p),1,100)],'Upper cutoff','Accumulated area',check('Estimate the finite-cutoff integral.',I,'area units','Use ln B when p=1; otherwise use the power antiderivative.'));},true);
calc(7,'euler','Euler’s method','Compare numerical steps with the exact solution of y′=x+y.',[N('y0','Initial y(0)',1,-1,3),N('h','Step size h',.2,.01,1,.01),N('steps','Number of steps',5,1,50,1)],'ynew=yold+h f(xold,yold)','BC topic; forward Euler with uniform steps. Longer times and larger steps can yield large errors.','Explain why each step uses a local tangent approximation.',s=>{let x=0,y=s.y0,points=[[x,y]];for(let i=0;i<s.steps;i++){y+=s.h*(x+y);x=(i+1)*s.h;points.push([x,y]);}let exact=(s.y0+1)*Math.exp(x)-x-1;return output([['Euler endpoint',y],['Exact endpoint',exact],['Error (Euler−exact)',y-exact]],[{name:'Euler points',points},series('Exact solution',t=>(s.y0+1)*Math.exp(t)-t-1,0,x)],'x','y',check('Estimate the first Euler step value.',s.y0+s.h*s.y0,'y units','Use the initial slope f(0,y₀)=y₀.'));},true);
calc(7,'logistic','Logistic differential equations','Locate the inflection population and compare initial and limiting growth.',[N('y0','Initial population',50,1,500,1),N('k','Carrying capacity K',1000,100,2000,1),N('r','Intrinsic rate r',.3,.01,1,.01),N('time','Evaluation time',10,0,30,1)],'y′=ry(1−y/K); y=K/[1+(K/y₀−1)e^(−rt)]','BC topic; closed population with constant positive r and K, no age structure or time delay.','Explain why total growth peaks at K/2.',s=>{let f=t=>s.k/(1+(s.k/s.y0-1)*Math.exp(-s.r*t));return output([['Population at time',f(s.time)],['Inflection population',s.k/2]],[series('Population',f,0,30)],'Time','Population',check('Estimate the population of maximum total growth.',s.k/2,'individuals','The quadratic growth function ry(1−y/K) peaks at y=K/2.'));},true);
calc(8,'arc-length','Arc length of a graph','Approximate the length of y=x² over an interval.',[N('a','Left endpoint',0,-2,2),N('b','Right endpoint',2,-1,3)],'L=∫√(1+(dy/dx)²)dx','BC topic; Simpson numerical integration with 1000 panels. This is length, not area.','Explain the origin of the square root using small line segments.',s=>{if(s.a>=s.b)throw Error('Choose a<b.');let L=integrate(x=>Math.sqrt(1+4*x*x),s.a,s.b);return output([['Arc length',L]],[series('Curve y=x²',x=>x*x,s.a,s.b)],'x','y',check('Estimate curve length.',L,'length units','Integrate √(1+4x²) over the interval.',.1));},true);
calc(9,'parametric-tangent','Parametric derivatives','Analyze x=t, y=at² and distinguish parameter rate from slope.',[N('a','Parabola coefficient a',1,.1,3),N('t','Parameter value t',1,-2,2)],'dy/dx=(dy/dt)/(dx/dt)=2at','BC-only unit. Here dx/dt=1 so all tangent slopes are finite.','Explain why dy/dt alone is not generally a slope in the xy-plane.',s=>output([['dy/dx',2*s.a*s.t],['d²y/dx²',2*s.a]],[{name:'Parametric path',points:Array.from({length:241},(_,i)=>{let t=-2+i/60;return[t,s.a*t*t]})}],'x','y',check('Estimate dy/dx.',2*s.a*s.t,'slope units','Divide the coordinate derivatives.')),true);
calc(9,'ellipse','Parametric ellipse & vertical tangents','Change ellipse radii and evaluate a tangent at a parameter angle.',[N('a','Horizontal semiaxis a',3,.2,5),N('b','Vertical semiaxis b',2,.2,5),N('t','Parameter angle (rad)',1,.01,6.27,.01)],'x=a cos t, y=b sin t; dy/dx=−b cos t/(a sin t)','BC-only unit. The displayed slope is undefined where sin t=0; no finite slope should be assigned there.','Distinguish a vertical tangent from a breakdown of the parametric curve.',s=>{if(Math.abs(Math.sin(s.t))<1e-8)throw Error('This angle has a vertical tangent; choose another angle for a finite-slope estimate.');let m=-s.b*Math.cos(s.t)/(s.a*Math.sin(s.t));return output([['Point x',s.a*Math.cos(s.t)],['Point y',s.b*Math.sin(s.t)],['Tangent slope',m]],[{name:'Ellipse',points:Array.from({length:361},(_,i)=>[s.a*Math.cos(i*Math.PI/180),s.b*Math.sin(i*Math.PI/180)])}],'x','y',check('Estimate the tangent slope.',m,'slope units','Divide dy/dt by dx/dt.'));},true);
calc(9,'vector-motion','Vector-valued motion','Calculate speed and acceleration for r(t)=⟨t,at²⟩.',[N('a','Vertical acceleration parameter a',1,.1,3),N('t','Time (s)',1,0,3)],'v=⟨1,2at⟩; speed=√(1+4a²t²); acceleration=⟨0,2a⟩','BC-only unit. Coordinate units are meters and parameter units seconds for this ideal path.','Explain why speed is a magnitude rather than the sum of velocity components.',s=>output([['Speed (m/s)',Math.sqrt(1+4*s.a*s.a*s.t*s.t)],['Acceleration magnitude (m/s²)',2*s.a]],[series('Speed',t=>Math.sqrt(1+4*s.a*s.a*t*t),0,3)],'Time (s)','Speed (m/s)',check('Estimate speed.',Math.sqrt(1+4*s.a*s.a*s.t*s.t),'m/s','Take the Euclidean magnitude of the velocity vector.')),true);
calc(9,'parametric-length','Parametric arc length','Integrate speed along an ellipse rather than using graph width.',[N('a','Horizontal semiaxis',3,.2,5),N('b','Vertical semiaxis',2,.2,5),N('end','Ending parameter angle (rad)',Math.PI,.1,6.28,.01)],'L=∫√((dx/dt)²+(dy/dt)²)dt','BC-only unit. Numerical Simpson integration with 1000 panels over t=0 to the chosen endpoint.','Explain why different coordinate speeds contribute quadratically.',s=>{let L=integrate(t=>Math.sqrt(s.a*s.a*Math.sin(t)**2+s.b*s.b*Math.cos(t)**2),0,s.end);return output([['Arc length',L]],[series('Parameter speed',t=>Math.sqrt(s.a*s.a*Math.sin(t)**2+s.b*s.b*Math.cos(t)**2),0,s.end)],'Parameter angle (rad)','Length per radian',check('Estimate the parametric arc length.',L,'length units','Integrate the magnitude of the derivative vector.',.1));},true);
calc(9,'polar-curve','Polar curves & traced area','Change a rose curve and integrate area over a specified parameter interval.',[N('a','Amplitude a',2,.1,4),N('k','Integer angular multiplier k',3,1,5,1),N('end','Upper angle (rad)',Math.PI/6,.01,6.28,.01)],'r=a cos(kθ); traced area = ½∫r²dθ','BC-only unit. Integrating over an interval that retraces the curve counts area with multiplicity, not necessarily unique enclosed area.','Explain why negative r does not make the area integrand negative.',s=>{let A=s.a*s.a*(s.end/4+Math.sin(2*s.k*s.end)/(8*s.k));return output([['Traced area (with multiplicity)',A]],[{name:'Rose over chosen interval',points:Array.from({length:601},(_,i)=>{let t=s.end*i/600,r=s.a*Math.cos(s.k*t);return[r*Math.cos(t),r*Math.sin(t)]})}],'x','y',check('Estimate traced polar area over this interval.',A,'area units','Integrate one half of r²; check whether the interval retraces.',.1));},true);
calc(9,'polar-tangent','Polar tangents','Differentiate r=a(1+cos θ) using Cartesian coordinate derivatives.',[N('a','Cardioid scale a',1,.1,3),N('theta','Angle θ (rad)',1,.05,6.23,.01)],'dy/dx=(r′sinθ+r cosθ)/(r′cosθ−r sinθ)','BC-only unit. Cusp and vertical-tangent cases require separate analysis; finite slope checks exclude near-zero dx/dθ.','Explain why dr/dθ is not dy/dx.',s=>{let r=s.a*(1+Math.cos(s.theta)),rp=-s.a*Math.sin(s.theta),dx=rp*Math.cos(s.theta)-r*Math.sin(s.theta),dy=rp*Math.sin(s.theta)+r*Math.cos(s.theta);if(Math.abs(dx)<1e-8)throw Error('Choose a point with nonzero dx/dθ for a finite-slope check.');return output([['Tangent slope',dy/dx]],[{name:'Cardioid',points:Array.from({length:361},(_,i)=>{let t=i*Math.PI/180,r=s.a*(1+Math.cos(t));return[r*Math.cos(t),r*Math.sin(t)]})}],'x','y',check('Estimate dy/dx.',dy/dx,'slope units','Differentiate r cosθ and r sinθ, then take their derivative ratio.'));},true);
calc(10,'geometric','Geometric series & partial sums','Compare partial sums with a convergent infinite geometric series.',[N('a','First term a',1,-3,3),N('r','Common ratio r',.5,-1.2,1.2,.01),N('n','Terms shown',10,1,60,1)],'Sn=a(1−rⁿ)/(1−r); S∞=a/(1−r) if |r|<1','BC-only unit. Infinite-sum convergence is conditional on |r|<1 for a nonzero first term.','Explain why terms approaching zero is necessary but not sufficient for general series convergence.',s=>{let sum=n=>s.r===1?s.a*n:s.a*(1-s.r**n)/(1-s.r),conv=Math.abs(s.r)<1||s.a===0;return output([['Partial sum',sum(s.n)],['Infinite sum',conv?s.a===0?0:s.a/(1-s.r):'Diverges']],[{name:'Partial sums',points:Array.from({length:s.n},(_,i)=>[i+1,sum(i+1)])}],'Number of terms','Partial sum',check('Estimate the finite partial sum.',sum(s.n),'sum units','Sum n geometric terms, with a separate case at r=1.'));},true);
calc(10,'p-series','p-series & the integral test','Compare finite sums and tail bounds for Σ1/nᵖ.',[N('p','Exponent p',2,.2,4),N('n','Terms summed',30,2,500,1)],'Σ1/nᵖ converges exactly when p>1','BC-only unit. For p>1, ∫N+1∞f≤tail≤∫N∞f. Bounds require positive decreasing f.','Explain why a finite partial sum never proves convergence.',s=>{let sum=0,pts=[];for(let i=1;i<=s.n;i++){sum+=i**(-s.p);pts.push([i,sum]);}let upper=s.p>1?s.n**(1-s.p)/(s.p-1):null;return output([['Partial sum',sum],['Convergence',s.p>1?'Converges':'Diverges'],['Upper tail bound',upper===null?'Not finite':upper]],[{name:'Partial sum',points:pts}],'N','Partial sum',conceptual('For what p does this infinite series converge?',['p>1','Every p>0','Only p=1'],0,'The improper integral of x^(−p) from 1 to infinity converges exactly for p>1.'));},true);
calc(10,'alternating','Alternating series & error bounds','Compare an alternating harmonic partial sum with ln 2.',[N('n','Number of terms',12,1,100,1)],'Σ(−1)^(n+1)/n=ln 2; error≤1/(N+1)','BC-only unit. Error bound uses positive decreasing term magnitudes tending to zero; this series is conditionally convergent.','Explain how an alternating-series bound differs from its exact error.',s=>{let sum=0,pts=[];for(let i=1;i<=s.n;i++){sum+=(i%2?1:-1)/i;pts.push([i,sum]);}return output([['Partial sum',sum],['Exact value ln 2',Math.log(2)],['Guaranteed error bound',1/(s.n+1)]],[{name:'Partial sums',points:pts},series('ln 2',()=>Math.log(2),1,s.n===1?2:s.n)],'N','Partial sum',check('Estimate the guaranteed error bound.',1/(s.n+1),'absolute error','The next omitted term bounds the error, not necessarily equals it.'));},true);
calc(10,'ratio','Ratio test & factorial terms','Apply the ratio test to Σxⁿ/n! and compare its partial sum with eˣ.',[N('x','x value',2,-5,5),N('n','Highest power N',8,1,30,1)],'lim |aₙ₊₁/aₙ| = lim |x|/(n+1)=0','BC-only unit. Terms start at n=0; the series converges absolutely for every finite real x.','Explain why a ratio limit of zero establishes convergence.',s=>{let term=1,sum=1,pts=[[0,1]];for(let n=1;n<=s.n;n++){term*=s.x/n;sum+=term;pts.push([n,sum]);}return output([['Partial sum',sum],['eˣ',Math.exp(s.x)],['Next/current absolute term ratio',Math.abs(s.x)/(s.n+1)]],[{name:'Partial sum',points:pts}],'Highest power included','Sum',check('Estimate the next/current absolute term ratio.',Math.abs(s.x)/(s.n+1),'dimensionless','Cancel factorial and powers to obtain |x|/(N+1).'));},true);
calc(10,'taylor-exp','Taylor polynomials for eˣ','Compare a centered Taylor polynomial with its function and a Lagrange bound.',[N('center','Expansion center a',0,-1,1),N('degree','Polynomial degree N',4,0,12,1),N('x','Evaluation x',1,-2,2)],'PN(x)=eᵃΣ(x−a)ⁿ/n!; error≤M|x−a|^(N+1)/(N+1)!','BC-only unit. M=e^max(a,x) bounds the next derivative on the interval between a and x.','Explain why the polynomial center and target distance both matter.',s=>{let fact=1;for(let i=1;i<=s.degree+1;i++)fact*=i;let P=x=>{let term=1,sum=1;for(let n=1;n<=s.degree;n++){term*=(x-s.center)/n;sum+=term;}return Math.exp(s.center)*sum},bound=Math.exp(Math.max(s.center,s.x))*Math.abs(s.x-s.center)**(s.degree+1)/fact;return output([['Polynomial estimate',P(s.x)],['Exact value',Math.exp(s.x)],['Lagrange error bound',bound]],[series('eˣ',Math.exp,-2,2),series('Taylor polynomial',P,-2,2)],'x','Value',check('Estimate the Taylor polynomial value.',P(s.x),'function units','Include every term through the selected degree.',.1));},true);
calc(10,'taylor-sin','Maclaurin polynomials for sin x','Increase the number of nonzero terms while preserving odd powers.',[N('terms','Nonzero terms',3,1,8,1),N('x','Evaluation x (rad)',1,-4,4)],'sin x = Σ(−1)ⁿx^(2n+1)/(2n+1)!','BC-only unit. The series converges for every finite x; small-degree approximations can be poor far from zero.','Explain why all even-power coefficients vanish.',s=>{let P=x=>{let term=x,sum=x;for(let n=1;n<s.terms;n++){term*=-x*x/((2*n)*(2*n+1));sum+=term;}return sum};return output([['Polynomial estimate',P(s.x)],['Exact sine',Math.sin(s.x)]],[series('sin x',Math.sin,-4,4),series('Polynomial',P,-4,4)],'x (rad)','Value',check('Estimate the polynomial value.',P(s.x),'function units','Use the first selected number of nonzero odd-power terms.',.1));},true);
calc(10,'power-interval','Power series intervals & endpoints','Explore the series for ln(1+x) and test its boundary values separately.',[N('x','Evaluation x',.5,-.99,1,.01),N('n','Number of terms',15,1,100,1)],'ln(1+x)=Σ(−1)^(n+1)xⁿ/n; convergence interval (−1,1]','BC-only unit. Radius is 1; endpoint x=1 converges conditionally, x=−1 diverges.','Explain why the ratio test alone does not decide the endpoints.',s=>{let sum=0,pts=[];for(let n=1;n<=s.n;n++){sum+=(n%2?1:-1)*s.x**n/n;pts.push([n,sum]);}return output([['Partial sum',sum],['ln(1+x)',Math.log1p(s.x)]],[{name:'Partial sums',points:pts}],'Terms','Sum',conceptual('What is the interval of convergence?',['−1<x≤1','−1≤x≤1','All real x'],0,'The interior follows from the ratio test; x=1 is alternating harmonic and x=−1 is negative harmonic.'));},true);
// ANATOMY & PHYSIOLOGY — body systems; quantitative toy models and explicit schematics.
function anatomy(unit,id,title,desc,fields,eq,limits,goal,compute){add('anatomy',unit,id,title,desc,fields,eq,limits+' Educational physiology; not a patient-specific or diagnostic model.',goal,compute);}
anatomy(1,'homeostasis','Homeostasis & negative feedback','Explore a regulated variable responding to a constant disturbance.',[N('set','Set point (relative units)',10,0,20),N('initial','Starting value',5,0,20),N('gain','Feedback rate (1/time)',.5,.05,2,.01),N('disturbance','Constant disturbance (units/time)',1,-3,3),N('time','Evaluation time',5,0,20)],'dX/dt = gain(set−X)+disturbance','Linear single-variable feedback model; real regulation involves delays, saturation and multiple signals.','Explain why a persistent disturbance can leave an offset from the set point.',s=>{let eq=s.set+s.disturbance/s.gain,f=t=>eq+(s.initial-eq)*Math.exp(-s.gain*t);return output([['Value at time',f(s.time)],['Model equilibrium',eq]],[series('Regulated variable',f,0,20),series('Set point',()=>s.set,0,20)],'Time (model units)','Relative value',check('Estimate the long-run model equilibrium.',eq,'relative units','Set dX/dt=0 and solve for X.'));});
anatomy(1,'tissues','Tissues: structure & function','Compare major tissue classes and their characteristic organization.',[S('tissue','Tissue class','epithelial',['epithelial','connective','muscle','nervous']),N('layers','Schematic repeated elements',5,3,10,1)],'Organization of cells and extracellular material supports tissue function.','A conceptual arrangement, not a histology image or classification algorithm.','Explain one structure–function relationship without using a cell-city analogy.',s=>{let d={epithelial:['Closely packed cells','Apical and basal surfaces','Barrier, transport or secretion'],connective:['Cells within extracellular matrix','Fibers and ground substance','Support and connection'],muscle:['Contractile cells','Actin and myosin interactions','Force generation'],nervous:['Excitable cells and supporting glia','Signal reception and transmission','Coordination']}[s.tissue];let o=output([['Tissue class',s.tissue]],[],'','',conceptual('Which tissue feature is especially characteristic of connective tissue?',['Substantial extracellular matrix','Absence of all cells','Only contractile sarcomeres'],0,'Connective tissues contain cells distributed within specialized extracellular matrix.'),d);o.schematic={type:'tissues',variant:s.tissue,count:s.layers};return o;});
anatomy(1,'cell-exchange','Cell geometry & exchange','Relate cell radius to membrane area and cellular volume.',[N('r','Cell radius (µm)',10,.5,40,.5)],'Sphere surface area/volume = 3/r','Ideal spherical cell without folds; exchange also depends on transport proteins, gradients and metabolism.','Explain why small size can help exchange without imposing one universal size limit.',s=>output([['Area (µm²)',4*Math.PI*s.r*s.r],['Volume (µm³)',4*Math.PI*s.r**3/3],['Area/volume (µm⁻¹)',3/s.r]],[series('Area/volume',r=>3/r,.5,40)],'Radius (µm)','Area/volume (µm⁻¹)',check('Estimate surface-area-to-volume ratio.',3/s.r,'µm⁻¹','Use sphere geometry, keeping dimensions distinct.')));
anatomy(2,'skin','Skin layers & injury depth','Inspect a layered schematic and identify which tissues a selected depth reaches.',[S('depth','Selected depth','epidermis',['epidermis','dermis','hypodermis'])],'Epidermis is epithelial; dermis is connective tissue; hypodermis lies below the skin proper.','Layer thicknesses and structures are schematic, not a prediction of wound severity.','Explain why dermal injury can involve blood vessels whereas the epidermis is avascular.',s=>{let o=output([['Selected depth',s.depth]],[],'','',conceptual('Which layer contains the skin’s blood vessels?',['Dermis','Epidermis alone','Only the stratum corneum'],0,'The epidermis is avascular and receives support by diffusion from the vascular dermis.'),['Epidermis: epithelial barrier','Dermis: vessels, glands and connective tissue','Hypodermis: subcutaneous tissue']);o.schematic={type:'skin',variant:s.depth};return o;});

 observation. The journal records the settings and a bounded sample of model data.</p><label for="observation">Observation, values & units</label><textarea id="observation" maxlength="4000" placeholder="At these settings, I observe… Compared with…"></textarea><button id="record" class="primary">Capture observation & settings</button><div id="evidence"></div></section><section class="learning-panel student-only" id="explain" hidden><h2>3. Explain using evidence</h2><label for="explanation">Claim, evidence & reasoning</label><textarea id="explanation" maxlength="8000" placeholder="My claim is… Observation 1 compared with 2 shows… The mechanism or mathematical argument is… My prediction… An assumption or limitation is…"></textarea><h3>Self-review</h3><label class="review-check"><input type="checkbox" data-check="claim">I address the investigation goal with a clear claim.</label><label class="review-check"><input type="checkbox" data-check="evidence">I compare at least two observations and use units or specific structural evidence.</label><label class="review-check"><input type="checkbox" data-check="reasoning">I justify the result with a mechanism or mathematical argument and revisit my prediction.</label><label class="review-check"><input type="checkbox" data-check="limits">I identify an assumption or limitation and distinguish model output from experimental evidence.</label><button id="complete" class="primary">Complete & see feedback</button></section><section class="learning-panel student-only" id="review" hidden><h2>4. Review & revise</h2><div id="feedback"></div><p>Written explanations are saved for self-review and teacher discussion. They are not automatically graded. Completion records the workflow; it does not establish mastery or an AP score.</p><button id="next" class="primary">Next investigation →</button></section><p id="message" role="status" aria-live="polite"></p>'+footer()+'</main></div>';
document.body.classList.toggle('teacher',config.teacher);
function getCheck(s){const c=clone(STEM.evaluate(active,s).check);if(c.options){const shift=[...active.id].reduce((n,c)=>n+c.charCodeAt(0),0)%c.options.length;c.options=[...c.options.slice(shift),...c.options.slice(0,shift)];c.correct=(c.correct-shift+c.options.length)%c.options.length;}return c;}
function lock(){const r=rec(),locked=!config.teacher&&r.phase==='predict';document.body.classList.toggle('locked',locked);$('locked').hidden=!locked;$('figure-wrap').hidden=locked;$('metrics').hidden=locked;$('data-table').hidden=locked;document.querySelectorAll('.exports button').forEach(b=>b.disabled=locked||!out);document.querySelectorAll('#fields input,#fields select').forEach(e=>e.disabled=locked);$('mono').disabled=locked;$('figure-title').disabled=locked;$('investigate').hidden=locked;$('explain').hidden=locked;$('review').hidden=r.phase!=='review';$('predict').hidden=!locked;if($('prediction'))$('prediction').disabled=!locked;$('reason').disabled=!locked;$('stage').textContent=locked?'1 · Predict':r.phase==='review'?'4 · Review':'2–3 · Investigate & explain';navProgress();}
function render(){out=null;$('error').hidden=true;$('diagram-svg').hidden=true;$('notice').textContent='';try{out=STEM.evaluate(active,state);$('figure').innerHTML=STEMFigure.draw(active,out,{title:$('figure-title').value,mono:$('mono').checked});$('metrics').innerHTML=out.metrics.map(m=>'<div><strong>'+E(STEM.fmt(m.value))+'</strong><span>'+E(m.name)+'</span></div>').join('');$('data-table').innerHTML=out.table?'<div class="table-scroll"><table><thead><tr>'+out.table.headers.map(h=>'<th>'+E(h)+'</th>').join('')+'</tr></thead><tbody>'+out.table.rows.map(row=>'<tr>'+row.map(v=>'<td>'+E(STEM.fmt(v))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';if(out.schematic&&out.curves?.length){$('diagram-svg').hidden=false;$('data-table').innerHTML+='<details class="structure-note"><summary>Explore the accompanying structure schematic</summary>'+STEMFigure.draw(active,{...out,curves:[]},{title:active.title+' · schematic',mono:$('mono').checked})+'</details>';} }catch(e){$('error').textContent=e.message;$('error').hidden=false;$('figure').innerHTML='';$('metrics').innerHTML='';$('data-table').innerHTML='';}lock();save();$('mode-link').href=path((config.teacher?'':'teacher-')+'unit-'+config.unit+'.html',JSON.stringify({id:active.id,state}));}
function fields(){const locked=!config.teacher&&rec().phase==='predict';$('fields').innerHTML=active.fields.map(f=>{let label='<label for="f-'+f.key+'">'+E(f.label)+'</label>';if(f.type==='select')return'<div class="field">'+label+'<select id="f-'+f.key+'" data-field="'+f.key+'">'+f.options.map(([v,t])=>'<option value="'+E(v)+'" '+(state[f.key]===v?'selected':'')+'>'+E(t)+'</option>').join('')+'</select></div>';let logarithmic=f.min>0&&f.max/f.min>1000&&!f.integer;return'<div class="field">'+label+'<input id="f-'+f.key+'" data-field="'+f.key+'" type="number" value="'+state[f.key]+'" min="'+f.min+'" max="'+f.max+'" step="'+(f.integer?1:'any')+'"><input type="range" id="r-'+f.key+'" data-range="'+f.key+'" data-log="'+logarithmic+'" min="'+(logarithmic?Math.log10(f.min):f.min)+'" max="'+(logarithmic?Math.log10(f.max):f.max)+'" step="'+(logarithmic?.001:f.step)+'" value="'+(logarithmic?Math.log10(state[f.key]):state[f.key])+'" aria-label="'+E(f.label)+' slider">'+(logarithmic?'<small>Logarithmic slider; type an exact value above.</small>':'')+'</div>';}).join('');document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const f=active.fields.find(f=>f.key===el.dataset.field);state[f.key]=f.type==='number'?el.value.trim()===''?NaN:Number(el.value):el.value;const slider=$('r-'+f.key);if(slider)slider.value=slider.dataset.log==='true'?Math.log10(state[f.key]):state[f.key];render();});document.querySelectorAll('[data-range]').forEach(el=>el.oninput=()=>{const f=active.fields.find(f=>f.key===el.dataset.range);let val=el.dataset.log==='true'?10**Number(el.value):Number(el.value);if(f.integer)val=Math.round(val);state[f.key]=val;$('f-'+f.key).value=val;render();});lock();}
function evidence(){const r=rec();$('evidence').innerHTML=r.observations.length?r.observations.map((o,i)=>'<details><summary>Observation '+(i+1)+' · '+E(o.note.slice(0,100))+'</summary><p>'+E(o.note)+'</p><dl>'+active.fields.map(f=>'<dt>'+E(f.label)+'</dt><dd>'+E(STEM.fmt(o.state[f.key]))+'</dd>').join('')+'</dl><button data-remove="'+i+'">Remove observation</button></details>').join(''):'<p class="micro">No observations yet. Record two distinct settings before completing.</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{r.observations.splice(Number(b.dataset.remove),1);r.completed=false;r.phase='explore';evidence();lock();save();});}
function feedback(){const r=rec();try{const c=getCheck(r.baseline),g=STEM.grade(c,r.prediction);$('feedback').innerHTML='<p><strong>'+(g.correct?'Your starting prediction is consistent with this model.':'Use the model and evidence to revisit your starting prediction.')+'</strong></p><p>Starting-condition answer: <strong>'+E(g.expected)+'</strong></p><p>'+E(c.why)+'</p>'+(c.options?'':'<p class="micro">Estimate tolerance: '+c.tolerance*100+'% of a nonzero answer, with an absolute tolerance of 1e−6 when the expected answer is zero. This feedback is not a course grade.</p>')+'<details><summary>Starting settings used for feedback</summary><dl>'+active.fields.map(f=>'<dt>'+E(f.label)+'</dt><dd>'+E(STEM.fmt(r.baseline[f.key]))+'</dd>').join('')+'</dl></details>';}catch{$('feedback').textContent='The saved starting settings no longer fit this model. Restart this activity to use the current model.';}}
function mount(){const r=rec();$('model-title').textContent=active.title;$('description').textContent=active.description;$('goal').textContent=active.goal;$('equation').textContent=active.equation;$('limits').textContent=active.limits;$('mode-link').textContent=config.teacher?'Open student investigation ↗':'Open teacher figure studio ↗';$('figure-title').value='';$('mono').checked=false;$('notes').open=config.teacher;
 try{let c=getCheck(r.baseline||state);$('question').textContent=c.question+(c.unit?' Answer in '+c.unit+'.':'');$('response-slot').innerHTML=c.options?'<select id="prediction" aria-labelledby="question"><option value="">Choose a prediction…</option>'+c.options.map((v,i)=>'<option value="'+i+'">'+E(v)+'</option>').join('')+'</select>':'<input id="prediction" type="text" inputmode="decimal" maxlength="100" aria-labelledby="question" placeholder="Estimate; scientific notation such as 1e6 is accepted">';$('prediction').value=r.prediction||'';$('prediction').oninput=()=>{r.prediction=$('prediction').value;save();};}catch(e){$('question').textContent=e.message;$('response-slot').innerHTML='';}
 for(const [id,key]of [['reason','reason'],['design','design'],['explanation','explanation'],['observation','observationDraft']]){$(id).value=r[key]||'';$(id).oninput=()=>{r[key]=$(id).value;if(r.phase==='review'&&['design','explanation'].includes(id)){r.completed=false;r.phase='explore';lock();}save();};}document.querySelectorAll('[data-check]').forEach(e=>{e.checked=r.checklist.includes(e.dataset.check);});evidence();fields();render();if(r.phase==='review')feedback();presets();$('message').textContent='';}
function select(id,incoming){save();active=models.find(a=>a.id===id)||models[0];state=STEM.defaults(active);const existing=journal.activities[config.course+':'+active.id];if(!config.teacher&&existing?.state)state=clean(active,existing.state);else if(incoming)state=clean(active,incoming);mount();try{history.replaceState(null,'','#'+active.id);}catch{}}
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>select(b.dataset.model));
$('predict').onclick=()=>{if(!out||!$('prediction')){$('message').textContent='Restore valid starting settings before predicting.';return;}const r=rec(),g=STEM.grade(getCheck(state),$('prediction').value);if(!g.valid||!$('reason').value.trim()){$('message').textContent='Enter a valid prediction and explain your reasoning before opening the model.';return;}r.prediction=$('prediction').value;r.reason=$('reason').value;r.baseline=clone(state);r.phase='explore';r.predictedAt=new Date().toISOString();$('message').textContent='Prediction recorded. Capture a baseline observation, then test one change.';lock();save();};
$('record').onclick=()=>{const r=rec(),note=$('observation').value.trim();if(!out||!note){$('message').textContent='Use valid model settings and describe an observation before recording.';return;}if(r.observations.length>=12){$('message').textContent='This activity holds 12 observations. Remove one to record another.';return;}let rows=STEMFigure.rows(out),sample=rows.length<=122?rows:[rows[0],...Array.from({length:121},(_,i)=>rows[1+Math.round(i*(rows.length-2)/120)])];r.observations.push({at:new Date().toISOString(),note,state:clone(state),metrics:clone(out.metrics),dataSample:clone(sample),totalDataRows:rows.length});r.observationDraft='';$('observation').value='';r.completed=false;r.phase='explore';evidence();lock();save();$('message').textContent='Observation and settings recorded.';};
$('complete').onclick=()=>{const r=rec();r.design=$('design').value;r.explanation=$('explanation').value;r.checklist=Array.from(document.querySelectorAll('[data-check]:checked')).map(e=>e.dataset.check);const distinct=r.observations.length>=2&&r.observations.some(o=>active.fields.some(f=>o.state[f.key]!==r.observations[0].state[f.key]));if(!distinct||!r.design.trim()||!r.explanation.trim()||r.checklist.length!==4){$('message').textContent='Record two distinct settings, describe your comparison, explain the result, and check all four review criteria.';return;}r.phase='review';r.completed=true;r.completedAt=new Date().toISOString();feedback();lock();save();$('review').scrollIntoView({behavior:'smooth'});$('message').textContent='Investigation completed and saved.';};
document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{const r=rec();r.checklist=Array.from(document.querySelectorAll('[data-check]:checked')).map(e=>e.dataset.check);r.completed=false;if(r.phase==='review')r.phase='explore';lock();save();});
$('reset').onclick=()=>{state=STEM.defaults(active);if(!config.teacher){const r=rec();if(r.phase==='predict'){r.prediction='';r.reason='';r.baseline=null;mount();}else{fields();render();}}else{fields();render();}};
$('restart').onclick=()=>{if(!confirm('Restart this activity and remove its saved prediction, evidence and explanation? Export first to keep a copy.'))return;delete journal.activities[config.course+':'+active.id];state=STEM.defaults(active);mount();save();};
$('next').onclick=()=>select(models[(models.indexOf(active)+1)%models.length].id);
$('mono').onchange=render;$('figure-title').oninput=render;
$('enlarge').onclick=()=>{focus=!focus;document.body.classList.toggle('focus-model',focus);$('enlarge').textContent=focus?'Return to investigation':'Enlarge model';$('workspace').scrollIntoView({behavior:'smooth'});};
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function source(){if(!out)throw Error('Fix model inputs first.');return $('figure').innerHTML;}
$('svg').onclick=()=>{try{download(source(),'image/svg+xml',active.id+'.svg');}catch(e){$('notice').textContent=e.message;}};
$('diagram-svg').onclick=()=>{if(out?.schematic)download(STEMFigure.draw(active,{...out,curves:[]},{title:active.title+' · schematic',mono:$('mono').checked}),'image/svg+xml',active.id+'-diagram.svg');};
$('png').onclick=async()=>{try{let src=source(),url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml'})),im=new Image();await new Promise((ok,bad)=>{im.onload=ok;im.onerror=bad;im.src=url});let h=Number(src.match(/viewBox="0 0 820 ([\d.]+)"/)[1]),canvas=document.createElement('canvas');canvas.width=2460;canvas.height=h*3;canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);let png=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!png)throw Error('No PNG was produced.');download(png,'image/png',active.id+'.png');$('notice').textContent='High-resolution PNG downloaded.';}catch{$('notice').textContent='PNG export failed. Try SVG or print.';}};
$('csv').onclick=()=>{if(out){let rows=STEMFigure.rows(out);download(rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv',active.id+'-data.csv');}};
$('print').onclick=()=>{if(out)window.print();};
$('share').onclick=async()=>{let link=location.href.split('#')[0]+'#'+encodeURIComponent(JSON.stringify({id:active.id,state}));try{await navigator.clipboard.writeText(link);$('notice').textContent=location.protocol==='file:'?'Settings link copied. Others need a hosted URL to open it.':'Settings link copied. Student progress is not included.';}catch{prompt('Copy the settings link:',link);}};
$('journal').onclick=()=>{save();let activities=Object.fromEntries(Object.entries(journal.activities).filter(([,r])=>r.course===config.course));download(JSON.stringify({version:1,activities},null,2),'application/json',config.course+'-learning-journal.json');};
$('report').onclick=()=>{save();let body=Object.values(journal.activities).filter(r=>r.course===config.course).map(r=>{let a=all.find(a=>a.id===r.id);if(!a)return'';let c;try{c=a.compute(r.baseline||r.state).check;}catch{c={question:'Saved investigation'};}let pred=r.prediction;if(c.options){let shift=[...a.id].reduce((n,c)=>n+c.charCodeAt(0),0)%c.options.length;c.options=[...c.options.slice(shift),...c.options.slice(0,shift)];pred=c.options[Number(pred)]||'Not selected';}const settings=raw=>'<table>'+a.fields.map(f=>'<tr><th>'+E(f.label)+'</th><td>'+E(STEM.fmt(raw?.[f.key]??''))+'</td></tr>').join('')+'</table>';return'<section><h2>Unit '+a.unit+' · '+E(a.title)+'</h2><p>'+E(a.goal)+'</p><p>Status: '+(r.completed?'Completed':'In progress')+'</p><h3>Prediction</h3><p>'+E(c.question)+'</p><p>'+E(pred||'')+'</p><p>'+E(r.reason||'')+'</p><h3>Starting settings</h3>'+settings(r.baseline||r.state)+'<h3>Investigation design</h3><p>'+E(r.design||'')+'</p>'+r.observations.map((o,i)=>'<h3>Observation '+(i+1)+'</h3><p>'+E(o.note)+'</p>'+settings(o.state)).join('')+'<h3>Explanation</h3><p>'+E(r.explanation||'')+'</p><h3>Model limitations</h3><p>'+E(a.limits)+'</p></section>';}).join('');download('<!doctype html><html lang="en"><meta charset="utf-8"><title>'+E(course.title)+' Journal</title><style>body{font:16px/1.6 system-ui;max-width:900px;margin:40px auto;padding:20px;color:#14264a}section{border-top:2px solid #b99a55;margin-top:30px}p{white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:6px;text-align:left}@media print{body{margin:0}h2,h3{break-after:avoid}}</style><h1>'+E(course.title)+' Learning Journal</h1><p>Predictions, settings, evidence and reasoning. Written work is not automatically graded.</p>'+body+'</html>','text/html',config.course+'-learning-report.html');};
function presetStore(){try{let x=JSON.parse(localStorage.getItem('eahs-campus-presets-v1')||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{};}catch{return{};}}
function presets(){let ps=presetStore()[config.course+':'+active.id]||[];$('presets').innerHTML='<option value="">Load preset…</option>'+ps.map((p,i)=>'<option value="'+i+'">'+E(p.name)+'</option>').join('');}
$('save-preset').onclick=()=>{let name=$('preset-name').value.trim();if(!name||!out){$('notice').textContent='Enter a preset name and valid settings.';return;}try{let p=presetStore(),key=config.course+':'+active.id;p[key]=p[key]||[];p[key].push({name,state:clone(state)});localStorage.setItem('eahs-campus-presets-v1',JSON.stringify(p));presets();$('notice').textContent='Preset saved in this browser.';}catch{$('notice').textContent='This browser cannot save the preset.';}};
$('delete-preset').onclick=()=>{const i=$('presets').value;if(i==='')return;try{let p=presetStore(),key=config.course+':'+active.id;if(Array.isArray(p[key])){p[key].splice(Number(i),1);localStorage.setItem('eahs-campus-presets-v1',JSON.stringify(p));presets();$('notice').textContent='Preset removed.';}}catch{$('notice').textContent='Unable to update presets.';}};
$('presets').onchange=()=>{if($('presets').value==='')return;let p=presetStore()[config.course+':'+active.id]?.[Number($('presets').value)];if(p){state=clean(active,p.state);fields();render();}};
const h=hash();if(h){active=models.find(a=>a.id===h.id);state=clean(active,h.state);}const existing=journal.activities[config.course+':'+active.id];if(!config.teacher&&existing?.state)state=clean(active,existing.state);mount();
window.addEventListener('hashchange',()=>{const h=hash();if(h)select(h.id,h.state);});
})();
</script></body></html>
